<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Music Player Android</title>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-card: #141417;
            --bg-card-hover: #1f1f24;
            --accent: #22c55e;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border: #222226;
            --player-height: 62px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0 0 calc(var(--player-height) + 10px) 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
        }

        /* ENCABEZADO COMPACTO */
        .app-header {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 10px 12px 8px 12px;
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-title span {
            color: var(--accent);
        }

        /* BUSCADOR REDUCIDO */
        .search-box {
            position: relative;
            width: 100%;
            margin-bottom: 8px;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px 7px 32px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* CHIPS DE FILTRO */
        .filter-bar {
            display: flex;
            gap: 6px;
        }

        .filter-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .filter-chip.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        /* LISTA DE CANCIONES */
        .content-container {
            padding: 10px 12px;
        }

        .song-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .song-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            background: var(--bg-card);
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .song-item.active {
            border-color: rgba(34, 197, 94, 0.4);
            background: rgba(34, 197, 94, 0.08);
        }

        .song-item.active .song-title {
            color: var(--accent);
            font-weight: 700;
        }

        .song-cover-box {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            background: #222;
        }

        .song-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ECUALIZADOR ANIMADO */
        .eq-bars {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }

        .song-item.active.playing .eq-bars {
            display: flex;
        }

        .eq-bar {
            width: 2px;
            height: 12px;
            background: var(--accent);
            border-radius: 1px;
            animation: bounce 0.8s infinite ease-in-out alternate;
        }

        .eq-bar:nth-child(1) { animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { animation-delay: 0.5s; }

        @keyframes bounce {
            0% { height: 3px; }
            100% { height: 14px; }
        }

        .song-details {
            flex: 1;
            min-width: 0;
        }

        .song-title {
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-artist {
            font-size: 11px;
            color: var(--text-muted);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-fav {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-fav.is-fav {
            color: #ef4444;
        }

        /* REPRODUCTOR FLOTANTE */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--player-height);
            background: rgba(20, 20, 23, 0.98);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10px;
            z-index: 200;
            touch-action: pan-y;
        }

        .progress-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        .player-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .player-track-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .player-cover {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
            background: #222;
            flex-shrink: 0;
        }

        .player-text {
            min-width: 0;
        }

        .player-title {
            font-size: 12px;
            font-weight: 600;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 10px;
            color: var(--text-muted);
            margin: 1px 0 0 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-control.active-mode {
            color: var(--accent);
        }

        .play-btn {
            background: var(--accent);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO -->
    <div class="app-header">
        <div class="header-title">
            <span>Music</span> Player <small id="song-count" style="font-size:11px; color:var(--text-muted); font-weight:normal; margin-left:auto;">Cargando...</small>
        </div>

        <div class="search-box">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" class="search-input" placeholder="Buscar canción o artista...">
        </div>

        <div class="filter-bar">
            <button class="filter-chip active" id="filter-all" onclick="setFilter('all')">Todas</button>
            <button class="filter-chip" id="filter-favs" onclick="setFilter('favs')">Favoritas ❤️</button>
        </div>
    </div>

    <!-- CONTENIDO -->
    <div class="content-container">
        <div class="song-list" id="song-list-container"></div>
    </div>

    <!-- REPRODUCTOR FLOTANTE COMPACTO -->
    <div class="player-bar" id="player-bar">
        <div class="progress-bar-container" id="progress-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>

        <div class="player-content">
            <div class="player-track-info">
                <img id="player-cover" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='52' viewBox='0 0 24 24' fill='%23555'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>" class="player-cover" alt="Portada">
                <div class="player-text">
                    <p class="player-title" id="player-title">Selecciona canción</p>
                    <p class="player-artist" id="player-artist">Música</p>
                </div>
            </div>

            <div class="player-controls">
                <button class="btn-control" id="btn-shuffle" title="Aleatorio">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
                </button>
                <button class="btn-control" id="btn-prev">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="play-btn" id="play-btn">
                    <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button class="btn-control" id="btn-next">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="btn-control" id="btn-repeat" title="Repetir">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                </button>
            </div>
        </div>
    </div>

    <audio id="audio"></audio>

    <script>
        const itemIds = [
            "lucas-sugo-zapada-en-vivo-en-un-poco-de-ruido-mp-3-160-k",
            "la-champions-liga-zapada-en-vivo-en-un-poco-de-ruido"
        ];

        let canciones = [];
        let currentIndex = -1;
        let currentFilter = 'all';
        let isShuffle = false;
        let isRepeat = false;
        let currentCovers = {};
        let favorites = JSON.parse(localStorage.getItem('app_music_favs')) || [];

        const audio = document.getElementById('audio');
        const listContainer = document.getElementById('song-list-container');
        const playBtn = document.getElementById('play-btn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const playerCover = document.getElementById('player-cover');
        const playerTitle = document.getElementById('player-title');
        const playerArtist = document.getElementById('player-artist');
        const progressFill = document.getElementById('progress-fill');
        const progressContainer = document.getElementById('progress-container');
        const searchInput = document.getElementById('search-input');
        const btnShuffle = document.getElementById('btn-shuffle');
        const btnRepeat = document.getElementById('btn-repeat');
        const playerBar = document.getElementById('player-bar');
        const songCountEl = document.getElementById('song-count');

        const defaultCover = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%233f3f46'><path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'/></svg>";

        function vibrate() {
            if (navigator.vibrate) navigator.vibrate(15);
        }

        async function fetchArchiveSongs() {
            let loadedSongs = [];

            for (const itemId of itemIds) {
                try {
                    const res = await fetch(`https://archive.org/metadata/${itemId}`);
                    const data = await res.json();
                    
                    if (data && data.files) {
                        const mp3Files = data.files.filter(f => f.name.endsWith('.mp3'));
                        
                        mp3Files.forEach(file => {
                            let title = file.title || file.name.replace('.mp3', '');
                            let artist = file.creator || data.metadata.creator || "Un Poco de Ruido";

                            // Limpieza de nombres de archivo
                            if (title.includes('-')) {
                                const parts = title.split('-');
                                if (parts.length >= 2 && !file.title) {
                                    artist = parts[0].trim();
                                    title = parts.slice(1).join('-').trim();
                                }
                            }

                            title = title.replace(/_\(MP3_160K\)/g, '').replace(/\(MP3_160K\)/g, '').replace(/%20/g, ' ').trim();

                            const audioUrl = `https://archive.org/download/${itemId}/${encodeURIComponent(file.name)}`;

                            loadedSongs.push({ title, artist, url: audioUrl });
                        });
                    }
                } catch (e) {
                    console.error("Error al cargar repositorio:", itemId, e);
                }
            }

            // Filtrado estricto contra duplicados por URL o combinación Titulo+Artista
            canciones = loadedSongs.filter((song, idx, self) =>
                idx === self.findIndex((t) => t.url === song.url || (t.title.toLowerCase() === song.title.toLowerCase() && t.artist.toLowerCase() === song.artist.toLowerCase()))
            );

            render();
        }

        function init() {
            setupControls();
            setupGestures();
            fetchArchiveSongs();
        }

        function setFilter(filter) {
            vibrate();
            currentFilter = filter;
            document.getElementById('filter-all').classList.toggle('active', filter === 'all');
            document.getElementById('filter-favs').classList.toggle('active', filter === 'favs');
            render();
        }

        function render() {
            listContainer.innerHTML = '';
            const query = searchInput.value.toLowerCase().trim();

            let list = canciones.filter((song, idx) => {
                const matchesSearch = song.title.toLowerCase().includes(query) || song.artist.toLowerCase().includes(query);
                const matchesFav = currentFilter === 'all' || favorites.includes(idx);
                return matchesSearch && matchesFav;
            });

            songCountEl.textContent = `${list.length} temas`;

            if (list.length === 0) {
                listContainer.innerHTML = `<p style="color:var(--text-muted); font-size:12px; text-align:center; padding:20px 0;">No se encontraron canciones.</p>`;
                return;
            }

            list.forEach((song) => {
                const realIndex = canciones.findIndex(c => c.url === song.url);
                const isFav = favorites.includes(realIndex);
                const isCurrent = realIndex === currentIndex;
                const coverSrc = currentCovers[realIndex] || defaultCover;

                const item = document.createElement('div');
                item.className = `song-item ${isCurrent ? 'active' : ''} ${isCurrent && !audio.paused ? 'playing' : ''}`;
                item.id = `track-${realIndex}`;
                item.onclick = () => playSong(realIndex);

                item.innerHTML = `
                    <div class="song-cover-box">
                        <img class="song-cover" id="img-${realIndex}" src="${coverSrc}" alt="Cover">
                        <div class="eq-bars">
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                        </div>
                    </div>
                    <div class="song-details">
                        <p class="song-title">${song.title}</p>
                        <p class="song-artist">${song.artist}</p>
                    </div>
                    <button class="btn-fav ${isFav ? 'is-fav' : ''}" onclick="toggleFav(event, ${realIndex})">
                        ${isFav ? '♥' : '♡'}
                    </button>
                `;

                listContainer.appendChild(item);

                if (!currentCovers[realIndex]) {
                    loadCover(song.artist, song.title, realIndex);
                }
            });
        }

        function toggleFav(e, index) {
            e.stopPropagation();
            vibrate();
            const favPos = favorites.indexOf(index);
            if (favPos > -1) {
                favorites.splice(favPos, 1);
            } else {
                favorites.push(index);
            }
            localStorage.setItem('app_music_favs', JSON.stringify(favorites));
            render();
        }

        function loadCover(artist, title, index) {
            const term = encodeURIComponent(`${artist} ${title}`);
            const script = document.createElement('script');
            const callbackName = `itunesCB_${index}_${Math.floor(Math.random()*100000)}`;

            window[callbackName] = function(data) {
                if (data.results && data.results.length > 0) {
                    let imgUrl = data.results[0].artworkUrl100.replace('100x100bb', '200x200bb');
                    currentCovers[index] = imgUrl;
                    document.querySelectorAll(`#img-${index}`).forEach(img => img.src = imgUrl);
                    if (index === currentIndex) playerCover.src = imgUrl;
                }
                delete window[callbackName];
                script.remove();
            };

            script.src = `https://itunes.apple.com/search?term=${term}&entity=song&limit=1&callback=${callbackName}`;
            document.body.appendChild(script);
        }

        function playSong(idx) {
            vibrate();
            if (currentIndex === idx) {
                togglePlay();
                return;
            }

            currentIndex = idx;
            const song = canciones[idx];
            audio.src = song.url;

            playerTitle.textContent = song.title;
            playerArtist.textContent = song.artist;
            playerCover.src = currentCovers[idx] || defaultCover;

            audio.play().then(() => {
                setPlayingUI(true);
            }).catch(err => console.log('Error de reproducción', err));

            render();
        }

        function togglePlay() {
            vibrate();
            if (currentIndex === -1) {
                if (canciones.length > 0) playSong(0);
                return;
            }

            if (audio.paused) {
                audio.play();
                setPlayingUI(true);
            } else {
                audio.pause();
                setPlayingUI(false);
            }
            render();
        }

        function setPlayingUI(isPlaying) {
            iconPlay.style.display = isPlaying ? 'none' : 'block';
            iconPause.style.display = isPlaying ? 'block' : 'none';
        }

        function playNext() {
            if (canciones.length === 0) return;
            if (isRepeat && currentIndex !== -1) {
                audio.currentTime = 0;
                audio.play();
                return;
            }
            let nextIndex = isShuffle 
                ? Math.floor(Math.random() * canciones.length) 
                : (currentIndex + 1) % canciones.length;
            playSong(nextIndex);
        }

        function playPrev() {
            if (canciones.length === 0) return;
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }
            let prevIndex = currentIndex - 1 < 0 ? canciones.length - 1 : currentIndex - 1;
            playSong(prevIndex);
        }

        function setupGestures() {
            let startX = 0;
            playerBar.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
            }, { passive: true });

            playerBar.addEventListener('touchend', (e) => {
                let endX = e.changedTouches[0].clientX;
                let diffX = startX - endX;

                if (Math.abs(diffX) > 40) {
                    if (diffX > 0) playNext();
                    else playPrev();
                }
            }, { passive: true });
        }

        function setupControls() {
            playBtn.onclick = togglePlay;
            document.getElementById('btn-next').onclick = playNext;
            document.getElementById('btn-prev').onclick = playPrev;

            btnShuffle.onclick = () => {
                vibrate();
                isShuffle = !isShuffle;
                btnShuffle.classList.toggle('active-mode', isShuffle);
            };

            btnRepeat.onclick = () => {
                vibrate();
                isRepeat = !isRepeat;
                btnRepeat.classList.toggle('active-mode', isRepeat);
            };

            searchInput.oninput = render;

            audio.ontimeupdate = () => {
                if (audio.duration) {
                    const pct = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = `${pct}%`;
                }
            };

            progressContainer.onclick = (e) => {
                if (audio.duration) {
                    const rect = progressContainer.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    audio.currentTime = (clickX / rect.width) * audio.duration;
                }
            };

            audio.onended = playNext;
        }

        init();
    </script>
</body>
</html>
